<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin: 14px;
            padding: 14px;
            background-color: green;
        }
        .childcontainer{
            margin: 15px;
            padding: 15px;
            background-color: rgb(128, 107, 0);
        }
        .child{
            border: 2px solid black;
            margin: 30px;
            padding: 30px;
            background-color: rgb(0, 4, 128);
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                i am a child
            </div>
        </section>
    </div>
    <script>
              document.querySelector(".container").addEventListener("click",()=>{
                alert(`Container was clciked`)
              }) 
              document.querySelector(".childcontainer").addEventListener("click",()=>{
                alert(`childContainer was clciked`)
              }) 
              document.querySelector(".child").addEventListener("click",(e)=>{
                e.stopPropagation()
                alert(`Child was clciked`)
              }) 
              
              
              setInterval(() => {
                document.querySelector(".child").style.backgroundColor = "pink";
              }, 4000);
            </script>
</body>
</html>
