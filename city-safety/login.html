<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Connect — Smart Societal Grievance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Decorative background: city skyline + soft blobs + dotted texture -->
  <div class="scene" aria-hidden="true">
    <span class="blob blob--tl"></span>
    <span class="blob blob--tr"></span>
    <span class="blob blob--bl"></span>
    <span class="blob blob--br"></span>

    <span class="dots dots--tl"></span>
    <span class="dots dots--br"></span>

    <svg class="skyline skyline--left" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#c9d6f2" stroke-width="1.4">
        <rect x="10" y="220" width="46" height="170"/>
        <rect x="64" y="170" width="40" height="220"/>
        <rect x="112" y="240" width="34" height="150"/>
        <rect x="154" y="120" width="14" height="270"/>
        <rect x="190" y="260" width="60" height="130"/>
        <rect x="262" y="300" width="70" height="90"/>
        <rect x="20" y="234" width="10" height="10"/>
        <rect x="36" y="234" width="10" height="10"/>
        <rect x="20" y="252" width="10" height="10"/>
        <rect x="36" y="252" width="10" height="10"/>
        <rect x="74" y="186" width="8" height="8"/>
        <rect x="88" y="186" width="8" height="8"/>
        <rect x="74" y="202" width="8" height="8"/>
        <rect x="88" y="202" width="8" height="8"/>
        <rect x="74" y="218" width="8" height="8"/>
        <rect x="88" y="218" width="8" height="8"/>
        <rect x="200" y="276" width="10" height="10"/>
        <rect x="218" y="276" width="10" height="10"/>
        <rect x="236" y="276" width="10" height="10"/>
        <rect x="200" y="296" width="10" height="10"/>
        <rect x="218" y="296" width="10" height="10"/>
        <rect x="236" y="296" width="10" height="10"/>
        <circle cx="161" cy="100" r="9"/>
        <path d="M2 390 H340" />
        <path d="M40 390 C 60 360, 90 360, 100 390" />
        <path d="M270 390 C 290 350, 330 350, 350 390" />
        <rect x="55" y="370" width="50" height="6"/>
      </g>
    </svg>

    <svg class="skyline skyline--right" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#c9d6f2" stroke-width="1.4">
        <rect x="330" y="200" width="50" height="190"/>
        <rect x="270" y="150" width="42" height="240"/>
        <rect x="226" y="250" width="32" height="140"/>
        <rect x="170" y="280" width="46" height="110"/>
        <rect x="110" y="230" width="50" height="160"/>
        <rect x="340" y="216" width="10" height="10"/>
        <rect x="356" y="216" width="10" height="10"/>
        <rect x="340" y="234" width="10" height="10"/>
        <rect x="356" y="234" width="10" height="10"/>
        <rect x="280" y="166" width="8" height="8"/>
        <rect x="294" y="166" width="8" height="8"/>
        <rect x="280" y="182" width="8" height="8"/>
        <rect x="294" y="182" width="8" height="8"/>
        <rect x="280" y="198" width="8" height="8"/>
        <rect x="294" y="198" width="8" height="8"/>
        <rect x="120" y="246" width="10" height="10"/>
        <rect x="138" y="246" width="10" height="10"/>
        <rect x="120" y="264" width="10" height="10"/>
        <rect x="138" y="264" width="10" height="10"/>
        <path d="M80 390 H400" />
        <path d="M120 390 C 140 355, 175 355, 190 390" />
        <path d="M300 390 C 315 365, 345 365, 360 390" />
        <rect x="200" y="372" width="46" height="6"/>
      </g>
    </svg>
  </div>

  <main class="page">
    <section class="login-card" aria-labelledby="brand-title">

      <header class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="20" width="10" height="22" rx="1.5" fill="#ffffff" fill-opacity="0.95"/>
            <rect x="18" y="6" width="12" height="36" rx="1.5" fill="#ffffff"/>
            <rect x="33" y="16" width="10" height="26" rx="1.5" fill="#ffffff" fill-opacity="0.95"/>
            <g fill="#2f7bf6">
              <rect x="8" y="24" width="2.6" height="2.6" rx="0.4"/>
              <rect x="8" y="30" width="2.6" height="2.6" rx="0.4"/>
              <rect x="8" y="36" width="2.6" height="2.6" rx="0.4"/>
            </g>
            <g fill="#0ea5e9">
              <rect x="21" y="10" width="2.8" height="2.8" rx="0.4"/>
              <rect x="25.5" y="10" width="2.8" height="2.8" rx="0.4"/>
              <rect x="21" y="16" width="2.8" height="2.8" rx="0.4"/>
              <rect x="25.5" y="16" width="2.8" height="2.8" rx="0.4"/>
              <rect x="21" y="22" width="2.8" height="2.8" rx="0.4"/>
              <rect x="25.5" y="22" width="2.8" height="2.8" rx="0.4"/>
              <rect x="21" y="28" width="2.8" height="2.8" rx="0.4"/>
              <rect x="25.5" y="28" width="2.8" height="2.8" rx="0.4"/>
            </g>
            <g fill="#2f7bf6">
              <rect x="36" y="20" width="2.6" height="2.6" rx="0.4"/>
              <rect x="36" y="26" width="2.6" height="2.6" rx="0.4"/>
              <rect x="36" y="32" width="2.6" height="2.6" rx="0.4"/>
            </g>
            <rect x="19.5" y="36" width="9" height="6" rx="0.6" fill="#2f7bf6"/>
          </svg>
        </span>
        <h1 id="brand-title" class="brand__title">CITY CONNECT</h1>
        <p class="brand__subtitle">Smart Societal Grievance Portal</p>
      </header>

      <form class="login-form" novalidate>

        <div class="field">
          <label for="fullName" class="field__label">Full Name</label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="3.6"/>
                <path d="M4.5 20c0-4.2 3.4-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/>
              </svg>
            </span>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" required />
          </div>
        </div>

        <div class="field">
          <label for="contact" class="field__label">Email Address or Phone Number</label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="2.5" width="10" height="19" rx="2.2"/>
                <path d="M10.5 18.2h3"/>
              </svg>
            </span>
            <input type="text" id="contact" name="contact" placeholder="Enter email or phone number" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password" class="field__label">Password</label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="10.5" width="14" height="10" rx="2"/>
                <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            <input type="checkbox" id="togglePassword" class="field__toggle-checkbox" />
            <label for="togglePassword" class="field__toggle" aria-hidden="true">
              <svg class="icon-eye" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a13.4 13.4 0 0 1-2.7 3.6M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-0.8"/>
                <path d="M9.5 9.8a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13"/>
            <path d="M14 6l6 6-6 6"/>
          </svg>
          <span>Login</span>
        </button>

        <div class="divider"><span>or</span></div>

        <div class="links">
          <a href="#" class="links__forgot">Forgot Password?</a>
          <p class="links__register">Don't have an account? <a href="#">Register</a></p>
        </div>

      </form>

    </section>
  </main>

</body>
</html>
