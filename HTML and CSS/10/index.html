<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid yellow;
            display: grid;
            grid-template-columns: 120px 100px;
            grid-template-rows: 100px 100px 100px;
           height: 50vh;
           width: 60vw;
         justify-items: center;
         align-items: center;
        }
        .item{
            border: 2px solid red;
           height: 55px;
           width: 55px;
        
        }
        .item1{
            grid-column: 1/2;
            grid-row: 1/2;
        }
         .item4{
            grid-column: 1/2;
            grid-row: 1/2;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="item item1">1 item</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item item4">4 post</div>
    <div class="item">5</div>
    <div class="item">6</div>
    </div>
</body>
</html>
