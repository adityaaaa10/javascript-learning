<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .parent{
        border: 2px solid purple;
        margin: 34px;
        padding: 43px;
        position: absolute;
        height: 1000px;
    }
    .box{
        height: 20vh;
        width: 50vw;
        border: 2px solid black;
        margin: 10px;
        padding: 7px;
    }
    .box0{
        background-color: black;
        position: sticky;
        top: 0px;
        width: 90%;
        height: 100px;
        z-index: 3px;
        margin: 0;
        padding: 0;
        
        
    }
    .box1{
        background-color: aqua;
        position: relative;
       
    }
    .box2{
        background-color: pink;
        position: relative;
        top: 30px;
        left: 20px;
    }
    .box3{
        background-color: coral;
        position: relative;
        z-index: 1px;
    }
    .box4{
        background-color: lightgreen;
        position: absolute;
        bottom: 0px;
        left: 10px;
    }
</style>
<body>
    <div class="parent">
    <div class="box box0"></div>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
    
</body>
</html>
