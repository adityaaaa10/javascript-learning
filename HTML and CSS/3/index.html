<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 1000000;
        padding: 11110;
    }

    .box {
        background-color: aqua;
    }

    .box1 {
        
        color: red;
        padding: 20px;
         margin: 5px;
        border: 5px solid blue;
        width: 90vw;
        height: 80vh;
      
        text-align: center;

    }

    .box2 {
        padding: 20px;
        margin: 5px;
        border: 6px solid black;
        text-align: center;
    }

    p1 {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 500;
    }

    p2 {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-style: italic;

    }

    p3 {
        text-decoration: underline;
        text-decoration-color: black;
        color: rgb(236, 24, 59);
        line-height: 4;

    }



    h1 {
        text-decoration: underline;
        text-decoration-color: black;
        text-overflow: ellipsis;
        text-align: center;
        text-decoration-thickness: 7;
    }

    .box3 {
        border: 5px solid black;
        padding: 90px;
        margin: 30px;
        display: inline-block;
        background-color: palevioletred;
    }

    .box4 {
        border: 10px solid black;
        padding: 90px;
        background-color: white;
        box-shadow: 10px 15px 5px #888888;
        display: inline-block;
        width: 30vw;
        margin: 30px;
        text-align: center;
        outline: 7px ;
    }
</style>

<body>
    <div class="box box1">I am a box</div>
    <div class="box box2">i am another box</div>
    <div>
        <h1>FONTS</h1>
        <br>
        <p1>This is about fonts</p1>
        <br>
        <p2>This is also about fonts</p2>
        <br>
        <p3>This is underlined fonts</p3>
    </div>

    <div class="box box3">use of inline block</div>
    <div class="box box3">also use of inline block</div>
    <br>
    <div class="box box4">use of shadow box</div>
    <br>
    <br>

</body>

</html>
